<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сервер картинок</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Загрузка изображения на наш сервер!</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if url %}
        <p>Изображение загружено!</p>
        <p>ID файла: {{ file_id }}</p>
        <p>Ссылка: <a href="{{ url }}">{{ url }}</a></p>
    {% endif %}

    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept=".jpg, .jpeg, .png, .gif">
        <br>
        <input type="submit" value="Загрузить">
    </form>
    <p><a href="/images-list">Все изображения</a> | <a href="/">На главную</a></p>
</body>
</html>
